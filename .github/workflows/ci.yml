name: tests

on:
  push:
  pull_request:

jobs:
  code-checks:
    runs-on: gtest
    steps:
    - uses: actions/checkout@v4
    - name: Check code formatting
      run: find src/ tests/ -name "*.cpp" -o -name "*.hpp" | xargs clang-format --dry-run --Werror
    - name: Static analysis
      run: cppcheck --enable=all --error-exitcode=1 --suppress=missingIncludeSystem src/ tests/

  build:
    runs-on: gtest
    needs: code-checks
    steps:
    - uses: actions/checkout@v4
    - name: Configure & Build
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
        cmake --build build -j$(nproc)
    - name: Quick Unit Test Check
      run: cd build && ctest --output-on-failure
    - name: Upload Binaries
      uses: actions/upload-artifact@v4
      with:
        name: build-assets
        path: |
          build/Tatlin
          build/unit_tests
        retention-days: 1

  matrix-tests:
    runs-on: gtest
    needs: build
    strategy:
      max-parallel: 3
      matrix:
        config-name: [default, low-memory, high-memory]
        include:
          - config-name: default
            mem_limit: 67108864
            delay: 0
          - config-name: low-memory
            mem_limit: 16777216
            delay: 0
          - config-name: high-memory
            mem_limit: 536870912
            delay: 0

    steps:
    - name: Checkout code (for test data)
      uses: actions/checkout@v4

    - name: Download Binaries
      uses: actions/download-artifact@v4
      with:
        name: build-assets
        path: build/
        skip-decompress: false

    - name: Prepare config.txt
      run: |

        echo "memory_limit_bytes=${{ matrix.mem_limit }}" > build/config.txt
        echo "read_delay_ms=${{ matrix.delay }}" >> build/config.txt
        echo "write_delay_ms=${{ matrix.delay }}" >> build/config.txt
        echo "move_delay_ms=${{ matrix.delay }}" >> build/config.txt
        echo "rewind_delay_ms=${{ matrix.delay }}" >> build/config.txt
        chmod +x build/Tatlin build/unit_tests

    - name: Run Large Data Tests
      run: |
        cd build
        for i in {0..9}; do
          ./Tatlin ../tests/LargeTests/input${i}.bin ../tests/LargeTests/current_output${i}.bin
          cmp "../tests/LargeTests/current_output${i}.bin" "../tests/LargeTests/output${i}.bin"
        done

    - name: Memory Leak Check (Valgrind)
      run: |
        cd build
        valgrind --leak-check=full --error-exitcode=1 ./Tatlin ../tests/LargeTests/input9.bin ../tests/LargeTests/current_output9.bin
        valgrind --leak-check=full --error-exitcode=1 ./unit_tests